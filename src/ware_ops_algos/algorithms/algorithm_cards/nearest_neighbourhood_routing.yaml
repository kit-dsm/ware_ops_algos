algo_name: NearestNeighbourhood
problem_type: routing
description: >
  Implementation of nearest neighbourhood heuristic

requirements:
  layout:
    type:
      - any
    features:
      - start_node
      - end_node
      - closest_node_to_start
      - min_aisle_position
      - max_aisle_position
      - distance_matrix
      - predecessor_matrix
  resources:
    type:
      - any
  orders:
    type:
      - any
  storage:
    type:
      - any

objective: Distance

capabilities:
  arbitrary_origin_node: true
  arbitrary_origin_edge: true
  arbitrary_end_node: true
  residual_picks: true
  dynamic_edge_costs: true

implementation:
  class_name: NearestNeighbourhoodRouting
  component_name: NearestNeighbourhood
  type: heuristic
