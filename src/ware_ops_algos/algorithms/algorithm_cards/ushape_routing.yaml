algo_name: UShapeRouting
problem_type: routing
description: U-shaped routing for a two-sided ladder warehouse graph.

requirements:
  layout:
    type:
      - conventional
    features:
      - start_node
      - end_node
      - closest_node_to_start
      - min_aisle_position
      - max_aisle_position
      - distance_matrix
      - predecessor_matrix
      - two_sided_aisle_rails
      - top_bottom_crossings
  resources:
    type:
      - human
  orders:
    type:
      - any
  storage:
    type:
      - any

objective: Distance

implementation:
  class_name: UShapeRouting
  component_name: UShape
  solver:
  type: heuristic
