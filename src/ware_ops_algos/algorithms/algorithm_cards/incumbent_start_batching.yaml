algo_name: IncumbentStartBatching
problem_type: batching
description: Preserve selected draft batches and insert new orders at minimum incremental route distance.
requirements:
  decision_features:
    type: [decision]
    features: [incumbent]
    constraints:
      incumbent: {equals: true}
  resources:
    type: [any]
    features: [capacities, dimensions_type]
    constraints:
      capacities: {not_equals: null}
      dimensions_type: {not_equals: null}
  orders:
    type: [any]
    features: [order_date]
objective: Distance
configuration:
  routing_class:
    problem_type: routing
implementation:
  class_name: IncumbentStartBatching
  type: heuristic
