algo_name: ExactSolving
problem_type: routing
description: >
  Exact TSP-based routing algorithm using Gurobi for order picking,
  minimizing total travel distance.

requirements:
  layout:
    type:
      - any
    features:
      - start_node
      - end_node
      - distance_matrix
      - predecessor_matrix
  resources:
    type:
      - any
  orders:
    type:
      - any
  storage:
    type:
      - any

objective: Distance

capabilities:
  arbitrary_origin_node: true
  arbitrary_origin_edge: true
  arbitrary_end_node: true
  residual_picks: true
  partial_batch: false
  locked_orders: false
  active_job_replacement: false

implementation:
  class_name: ExactTSPRoutingDistance
  component_name: TSPRouting
  solver: Gurobi
  type: exact
