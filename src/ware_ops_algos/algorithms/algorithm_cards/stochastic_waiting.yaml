algo_name: StochasticWaitingAnalysis
problem_type: waiting_analysis
description: >
  Retrospective project_4D4L analysis of a known insert order under
  S-shape routing. This is an evaluation tool, not an online release policy.

requirements:
  layout:
    type:
      - conventional
    features:
      - n_aisles
      - n_pick_locations
      - dist_aisle
      - dist_pick_locations
    constraints:
      n_blocks: 1
  resources:
    type:
      - human
    features:
      - speed
      - time_per_pick
  orders:
    type:
      - standard
    features:
      - order_date
  storage:
    type:
      - any

objective: CompletionTime

implementation:
  class_name: StochasticWaitingOptimizer
  solver: heuristic
