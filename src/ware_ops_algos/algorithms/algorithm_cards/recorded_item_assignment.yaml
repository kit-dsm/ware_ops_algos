algo_name: RecordedItemAssignment
problem_type: item_assignment
description: >
  Assign each order position to its recorded pick node; applicable only where a recorded picking plan is given.

requirements:
  layout:
    type:
      - any
    features: []
  information:
    type: [process_information]
    features: [recorded_plan.type]
    constraints:
      recorded_plan.type: {equals: recorded_picking_plan}
  resources:
    type:
      - human
  orders:
    type:
      - any
  storage:
    type:
      - any

objective: Distance

implementation:
  class_name: RecordedItemAssignment
  component_name: RecordedIA
  type: heuristic
