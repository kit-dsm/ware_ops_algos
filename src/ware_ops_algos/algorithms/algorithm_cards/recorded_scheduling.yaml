algo_name: RecordedPlan
problem_type: scheduling
description: >
  Assigns each tour to its recorded picker in the recorded order, without waiting between tours; applicable only where a recorded picking plan is given.

requirements:
  layout:
    type:
      - any
    features: []
  information:
    type: [process_information]
    features: [recorded_plan.type]
    constraints:
      recorded_plan.type: {equals: recorded_picking_plan}
  resources:
    type:
      - human
  orders:
    type:
      - any
  storage:
    type:
      - any

objective: Distance

implementation:
  class_name: RecordedScheduling
  component_name: RecordedPlan
  type: heuristic
